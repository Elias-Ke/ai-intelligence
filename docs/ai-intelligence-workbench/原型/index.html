    function titleFor(view){return {dashboard:['Wednesday · 23 Sep 2026','今天，AI 世界发生了什么？','先看值得认真读的变化，再决定哪些信号值得做成产品、服务或内容。'],stream:['INTELLIGENCE STREAM','完整情报流','所有经过基础处理的发现，按主题、来源和价值筛选。'],trends:['SIGNAL MAP','趋势追踪','查看主题、公司和技术方向如何从出现走向落地。'],opportunities:['OPPORTUNITY RADAR','副业机会','把外部变化转成可验证的产品、服务和知识生意。'],topics:['CONTENT DESK','内容选题','把技术和落地变化转成可继续研究的多平台表达角度。'],saved:['PERSONAL LIBRARY','收藏','你标记为值得继续判断的信号和卡片。'],history:['RUN HISTORY','扫描历史','每次扫描都是一份可回看的情报快照。'],sources:['SOURCE MAP','来源库','管理稳定来源与系统自动发现的新来源。']}[view]}

    function dashboard(){return shell('dashboard',`<section class="scan-panel"><div class="scan-copy"><h2>发现过去 24 小时的新信号</h2><p>高质量来源库持续监测，同时扫描来源库之外的公开网页、案例和社区讨论。</p></div><div class="scan-controls"><select id="range"><option>过去 24 小时</option><option>过去 3 天</option><option>过去 7 天</option><option>自定义范围</option></select><button class="primary" data-action="scan">开始扫描</button></div><div class="scan-status"><div class="status-line"><span>上次扫描</span><strong id="scanState">已完成</strong></div><div class="progress"><i id="progressBar"></i></div><div class="scan-hint" id="scanHint">2 小时前完成 · 486 条发现 · 32 个主题</div></div></section><section class="stats"><div class="stat"><div class="stat-label">本次发现</div><div class="stat-value">486</div><div class="stat-note">较上次 +18%</div></div><div class="stat"><div class="stat-label">去重后信号</div><div class="stat-value">142</div><div class="stat-note">覆盖 32 个主题</div></div><div class="stat"><div class="stat-label">机会卡</div><div class="stat-value">12</div><div class="stat-note">4 条建议验证</div></div><div class="stat"><div class="stat-label">选题卡</div><div class="stat-value">18</div><div class="stat-note">6 条适合深度解读</div></div></section><div class="layout"><section><div class="section-head"><h2>重点信号</h2><a href="#" data-view-link="stream">查看完整情报流 →</a></div><div class="signal-list">${signals.slice(0,3).map(signalCard).join('')}</div></section><aside class="side-column"><div class="panel"><h3>趋势追踪</h3><div class="panel-sub">你关注的方向正在发生什么</div>${[['Agent 工作流','38 条新信号','↑ 24%'],['企业知识库','21 条新信号','↑ 16%'],['AI 内容生产','17 条新信号','→ 稳定'],['AI 教育产品','12 条新信号','↓ 5%']].map(x=>`<div class="topic"><div><div class="topic-name">${x[0]}</div><div class="topic-meta">过去 7 天 · ${x[1]}</div></div><span class="trend">${x[2]}</span></div>`).join('')}</div><div class="panel"><h3>扫描动态</h3><div class="panel-sub">最近一次任务的关键节点</div><div class="timeline"><div class="timeline-item"><i class="timeline-line"></i><div><strong>已完成分析</strong><span>142 条去重信号 · 32 个主题</span></div></div     function stream(){const list=signals.filter(s=>{const matchesQuery=!state.query||`${s.title} ${s.summary} ${s.tags.join(' ')}`.toLowerCase().includes(state.query.toLowerCase());const matchesFilter=state.filter==='全部'||s.tags.includes(state.filter);return matchesQuery&&matchesFilter});return shell('stream',`<div class="toolbar"><div class="toolbar-left"><input id="streamSearch" value="${state.query}" placeholder="搜索主题、公司、技术或场景" /><button class="filter ${state.filter==='全部'?'active':''}" data-filter="全部">全部</button><button class="filter ${state.filter==='Agent'?'active':''}" data-filter="Agent">Agent</button><button class="filter ${state.filter==='企业服务'?'active':''}" data-filter="企业服务">企业服务</button><button class="filter ${state.filter==='内容生产'?'active':''}" data-filter="内容生产">内容生产</button></div><div class="toolbar-right"><select><option>价值优先</option><option>最新优先</option><option>证据最多</option></select><span class="subtle">${list.length} 条结果</span></div></div><div class="signal-list">${list.length?list.map(signalCard).join(''):'<div class="empty">没有找到匹配的情报，换一个关键词或清除筛选。</div>'}</div>`,'<button class="primary" data-action="scan">开始新一轮扫描 →</button>')}
    function trends(){return shell('trends',`<div class="grid-3" style="margin-top:24px">${[['Agent 工作流','38','↑ 24%','从工具调用走向流程交付'],['企业知识库','21','↑ 16%','结果监控成为采购条件'],['AI 内容生产','17','→ 稳定','可信度层开始出现']].map(x=>`<article class="trend-card"><h3>${x[0]}</h3><div class="trend-number">${x[1]}</div><span class="trend">${x[2]}</span><p>${x[3]}</p><button class="icon-btn" style="margin-top:14px" data-action="follow" data-topic="${x[0]}">${state.followed.has(x[0])?'✓ 已关注':'＋ 关注主题'}</button></article>`).join('')}</div><div class="timeline-wide"><div class="section-head"><h2>Agent 工作流 · 主题时间线</h2><span class="subtle">过去 30 天 · 86 条关联信号</span></div><div class="event"><time>09 月 23 日</time><i></i><div><strong>进入真实落地阶段</strong><span>4 个企业案例出现任务完成率、人工接管率和审计指标。</span></div></div><div class="event"><time>09 月 18 日</time><i></i><div><strong>工具链开始组合</strong><span>多个团队把 Agent 接入 issue、测试和部署流程。</span></div></div><div class="event"><time>09 月 04 日</time><i></i><div><strong>新产品密集发布</strong><span>基础能力趋同，差异转向上下文、权限和结果控制。</span></div></div></div>`,'<button class="ghost" data-action="notify">管理关注主题</button>')}

    function confirmScan(){const range=document.getElementById('range')?.value||'过去 24 小时';openDialog({eyebrow:'START SCAN',title:'开始新一轮情报扫描？',message:`扫描范围：${range}。系统将同时搜索国内与国际公开信息。`,details:'<p>如果已有扫描正在运行，将继续展示当前任务，不会重复创建。</p>',confirmText:'开始扫描',onConfirm:()=>{if(state.view!=='dashboard'){state.view='dashboard';render()}setTimeout(runScan,0)}})}

    function openAddSource(){dialogAction=null;const modal=document.getElementById('modal');modal.dataset.blocking='false';document.getElementById('modalBody').innerHTML=`<header><div><div class="eyebrow">SOURCE LIBRARY</div><h2>添加公开来源</h2></div><button class="modal-close" data-action="close" aria-label="关闭">×</button></header><div class="form-grid"><div class="field"><label for="sourceName">来源名称</label><input id="sourceName" placeholder="例如：Anthropic News"></div><div class="field"><label for="sourceGroup">来源分组</label><select id="sourceGroup"><option>官方发布</option><option>研究论文</option><option>案例与媒体</option></select></div><div class="field full"><label for="sourceUrl">公开 URL</label><input id="sourceUrl" placeholder="https://example.com/feed"><div class="field-error" id="sourceError"></div></div><div class="field"><label for="sourceKind">来源类型</label><select id="sourceKind"><option>RSS</option><option>公开 API</option><option>网页</option></select></div><div class="field"><label for="sourceRegion">区域与语言</label><select id="sourceRegion"><option>国内 · 中文</option><option>国际 · 英文</option><option>全球 · 混合</option></select></div></div><div class="modal-actions"><button class="ghost" data-action="close">取消</button><button class="primary" data-action="source-submit">校验并添加</button></div>`;modal.classList.add('show');bindModalEvents();setTimeout(()=>document.getElementById('sourceName')?.focus(),0)}
    function confirmItemAction(action,title){const isArchive=action==='archive';openDialog({eyebrow:isArchive?'ARCHIVE SIGNAL':'IGNORE SIGNAL',title:isArchive?'归档这条情报？':'忽略这条结果？',message:isArchive?'归档后不会出现在默认情报流，但仍可从归档筛选中恢复。':'忽略后将降低相似内容的排序权重，可以稍后撤销。',details:`<p>${title}</p>`,confirmText:isArchive?'归档情报':'忽略结果',tone:isArchive?'warning':'error',onConfirm:()=>showToast(isArchive?'情报已归档，可在归档筛选中恢复':'结果已忽略，可撤销','warning')})}
    function openModal(kind,title){const data=kind==='opportunity'?opportunityData.find(x=>x.title===title):kind==='topic'?topicData.find(x=>x.title===title):signals.find(x=>x.title===title);if(!data)return;const isSignal=kind==='signal';const modal=document.getElementById('modal');modal.dataset.blocking='false';document.getElementById('modalBody').innerHTML=`<header><div><div class="eyebrow">${isSignal?'SIGNAL DETAIL':kind==='opportunity'?'OPPORTUNITY CARD':'CONTENT TOPIC'}</div><h2>${data.title}</h2></div><button class="modal-close" data-action="close">×</button></header><div class="modal-section"><h3>${isSignal?'为什么值得看':kind==='opportunity'?'机会判断':'创作方向'}</h3><p>${isSignal?data.summary:data.desc}</p></div><div class="modal-section"><h3>证据与下一步</h3><p>${isSignal?'已关联多个来源，建议打开原文核查技术变化、落地程度和是否存在相互独立的证据。':kind==='opportunity'?'先访谈 3 个目标用户，验证当前替代方案、预算和交付边界，再决定是否做最小服务包。':'先补充一个真实案例和一个反例，再选择适合的平台切入，不直接生成成稿。'}</p></div><div class="modal-section"><h3>状态操作</h3><div class="toolbar-left" style="margin-top:9px"><button class="filter" data-action="save" data-title="${data.title}">☆ 收藏</button><button class="filter" data-action="notify">标记为准备验证</button><button class="filter" data-action="notify">打开原始证据</button>${isSignal?`<button class="filter" data-action="ignore" data-title="${data.title}">忽略</button><button class="filter" data-action="archive" data-title="${data.title}">归档</button>`:''}</div></div>`;modal.classList.add('show');bindModalEvents()}
    function bindViewEvents(){document.querySelectorAll('[data-view-link]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();state.view=b.dataset.viewLink;render()}));document.querySelectorAll('[data-action="scan"]').forEach(b=>b.addEventListener('click',confirmScan));document.querySelectorAll('[data-action="save"]').forEach(b=>b.addEventListener('click',()=>{state.saved.add(b.dataset.title);b.textContent='★ 已收藏';showToast('已加入收藏')}));document.querySelectorAll('[data-action="detail"]').forEach(b=>b.addEventListener('click',()=>openModal('signal',b.dataset.title)));document.querySelectorAll('[data-action="opportunity"]').forEach(b=>b.addEventListener('click',()=>openModal('opportunity',b.dataset.title)));document.querySelectorAll('[data-action="topic"]').forEach(b=>b.addEventListener('click',()=>openModal('topic',b.dataset.title)));document.querySelectorAll('[data-action="failure"]').forEach(b=>b.addEventListener('click',openFailure));document.querySelectorAll('[data-action="add-source"]').forEach(b=>b.addEventListener('click',openAddSource));document.querySelectorAll('[data-action="notify"]').forEach(b=>b.addEventListener('click',()=>showToast('操作已记录')));document.querySelectorAll('[data-action="toggle"]').forEach(b=>b.addEventListener('click',()=>{if(!b.classList.contains('on')){b.classList.add('on');showToast('来源组已启用');return}const name=b.closest('.source-row')?.querySelector('h3')?.textContent||'该来源组';openDialog({eyebrow:'SOURCE CONTROL',title:'暂停这个来源组？',message:`暂停后，${name}将不参与后续扫描。`,confirmText:'暂停来源组',tone:'warning',onConfirm:()=>{b.classList.remove('on');showToast('来源组已暂停','warning')}})}));document.querySelectorAll('[data-action="follow"]').forEach(b=>b.addEventListener('click',()=>{const topic=b.dataset.topic;state.followed.has(topic)?state.followed.delete(topic):state.followed.add(topic);render();showToast(state.followed.has(topic)?`已关注${topic}`:`已取消关注${topic}`)}));const search=document.getElementById('streamSearch');if(search){search.addEventListener('input',e=>{state.query=e.target.value;render()})}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;render()}));document.querySelectorAll('[data-opp-filter]').forEach(b=>b.addEventListener('click',()=>{state.oppFilter=b.dataset.oppFilter;render()}));document.querySelectorAll('[data-platform]').forEach(b=>b.addEventListener('click',()=>{state.platform=b.dataset.platform;render()}));document.querySelectorAll('.toolbar .filter:not([data-filter]):not([data-opp-filter]):not([data-platform])').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast('筛选条件已切换')}))}
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;state.query='';state.filter='全部';render()}));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&e.currentTarget.dataset.blocking!=='true')closeDialog()});document.addEventListener('keydown',e=>{const modal=document.getElementById('modal');if(!modal.classList.contains('show'))return;if(e.key==='Escape'&&modal.dataset.blocking!=='true')closeDialog();if(e.key==='Tab'){const focusable=[...modal.querySelectorAll('button,input,select')].filter(x=>!x.disabled);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
  </script>
</body>
